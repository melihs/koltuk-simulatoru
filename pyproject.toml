[project]
name = "koltuk-simulatoru"
version = "0.1.0"
description = "2 serbestlik dereceli (pitch + roll) hareketli koltuk simulasyon ve optimizasyon programi"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.18",
    "streamlit>=1.30",
    "pyyaml>=6.0",
    "pandas>=2.1",
]

[project.optional-dependencies]
optimize = ["pymoo>=0.6"]
report = ["reportlab>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seatsim"]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ISC", "RET", "SIM"]
ignore = [
    "C408",    # dict(...) kwarg bicimi bilincli tercih -- okunurlugu artiriyor
    "E501",    # satir uzunlugu: formatlayici degil, insan karari
    "SIM108",  # ucluk ifade her zaman daha okunur degil
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["seatsim"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
